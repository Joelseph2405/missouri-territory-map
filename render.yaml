services:
  - type: web
    name: black-box-prospecting
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      # Database URL will be auto-injected if we attach a Postgres DB
      # Or we use a persistent disk:
    disk:
      name: data
      mountPath: /var/lib/data
      sizeGB: 1

databases:
  - name: black-box-db
    plan: free
    databaseName: businesses
    user: blackbox
